name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create (for example, v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test and lint (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build Windows installer and portable executable
        if: runner.os == 'Windows'
        run: |
          cargo tauri build --bundles nsis
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item target/release/ztik.exe release-artifacts/ztik-windows-x64-portable.exe
          $setups = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe'
          if (-not $setups) { throw 'NSIS installer was not produced.' }
          $setups | Copy-Item -Destination release-artifacts
        shell: pwsh

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Test and lint (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo tauri build --bundles deb,appimage
          mkdir -p release-artifacts
          cp target/release/bundle/appimage/*.AppImage release-artifacts/
          cp target/release/bundle/deb/*.deb release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          for file in *; do
            if [ "$file" != "SHA256SUMS.txt" ]; then sha256sum "$file"; fi
          done > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
